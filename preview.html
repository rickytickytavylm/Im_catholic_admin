<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Предпросмотр — ЯКатолик</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/admin.css" />
    <style>
      body { background: #f6f2ea; }
      .preview-wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }
      .preview-kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #897C70; font-weight: 800; }
      .preview-wrap h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(32px, 6vw, 48px); line-height: 1.15; margin: 8px 0 16px; }
      .preview-meta { color: #897C70; font-size: 14px; margin-bottom: 22px; }
      .preview-cover { aspect-ratio: 16/9; border-radius: 18px; overflow: hidden; margin-bottom: 28px; background: #ddd; }
      .preview-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .preview-body { font-size: 18px; line-height: 1.75; }
      .preview-body h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; }
      .preview-body img { max-width: 100%; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div class="preview-wrap" id="view">
      <p class="preview-kicker">Предпросмотр</p>
      <p>Загрузка</p>
    </div>
    <script src="js/store.js"></script>
    <script>
      (function () {
        var id = new URLSearchParams(location.search).get('id');
        var mat = null;
        try { mat = JSON.parse(sessionStorage.getItem('yak_preview_post') || 'null'); } catch (e) {}
        if ((!mat || mat.id !== id) && window.AdminStore && id) mat = AdminStore.getMaterial(id);
        var view = document.getElementById('view');
        if (!mat) {
          view.innerHTML = '<p>Нет данных для предпросмотра.</p>';
          return;
        }
        document.title = (mat.title || 'Запись') + ' — предпросмотр';
        var rubs = (mat.rubrics || []).map(function (r) {
          return AdminStore.postRubricTitle ? AdminStore.postRubricTitle(r) : r;
        }).join(' · ');
        view.innerHTML =
          '<p class="preview-kicker">' + (AdminStore.postSectionTitle ? AdminStore.postSectionTitle(mat.section) : '') +
          (rubs ? ' · ' + rubs : '') + '</p>' +
          '<h1>' + (mat.title || 'Без названия') + '</h1>' +
          '<p class="preview-meta">' + (mat.authorName || mat.authorTag || '') +
          (mat.status === 'published' ? ' · опубликовано' : ' · черновик') + '</p>' +
          (mat.cover ? '<div class="preview-cover"><img src="' + mat.cover + '" alt="" /></div>' : '') +
          '<div class="preview-body rte-body">' + (mat.body || '') + '</div>';
      })();
    </script>
  </body>
</html>
